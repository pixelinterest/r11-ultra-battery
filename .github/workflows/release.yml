name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build onedir zip
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          python scripts/build_release.py --version "$ver"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/R11UltraBattery-windows.zip
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            R11 Ultra Battery Tracker — Windows system tray battery monitor for the Attack Shark R11 Ultra.

            ### Features
            - Live colored percent in the system tray (consistent font size for 1–3 digits)
            - 2.4 GHz dongle (`0x3554:0xFB44`) and USB-C (`0x3554:0xFB43`)
            - Start with Windows toggle
            - Background launch (no console)
            - Keeps last reading up to 5 minutes on a missed poll
            - Source builds: tweak tray font size / charging color in `r11_battery/icons.py`

            ### Install
            1. Download **R11UltraBattery-windows.zip**
            2. Extract the folder
            3. Run `R11UltraBattery.exe`

            Onedir (folder) build — usually fewer antivirus false positives than a single packed exe.
            Source is in this repository if you prefer to run from Python.
